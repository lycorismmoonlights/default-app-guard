name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    name: Portable validation
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Test Sites worker
        run: pnpm run test:sites

      - name: Test promotion contracts
        run: pnpm run test:promotion

      - name: Test package integrity behavior
        shell: pwsh
        run: ./tests/Test-PackageIntegrity.ps1

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Test portable .NET behavior
        run: >
          dotnet test
          native/DefaultAppGuard.Tests/DefaultAppGuard.Tests.csproj
          --configuration Release
          --filter "Category!=MainAlgorithmIntegration"
          --logger "console;verbosity=normal"

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          @(
            Get-ChildItem packaging -File |
              Where-Object { $_.Extension -in @(".ps1", ".psm1") }
            Get-ChildItem tests -Filter *.ps1 -File
          ) | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)"
              }
            }
          }
          if ($failed) {
            throw "One or more PowerShell scripts failed to parse."
          }
