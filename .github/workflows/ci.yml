name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    name: Portable validation (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.302

      - name: Verify pinned toolchain
        shell: pwsh
        run: |
          $metadata = Get-Content package.json -Raw | ConvertFrom-Json
          $sdk = Get-Content global.json -Raw | ConvertFrom-Json
          if ((dotnet --version) -ne [string]$sdk.sdk.version) {
            throw "The active .NET SDK does not match global.json."
          }
          if ((node -p "process.versions.node") -ne [string]$metadata.engines.node) {
            throw "The active Node.js version does not match package.json."
          }
          if ((pnpm --version) -ne [string]$metadata.engines.pnpm) {
            throw "The active pnpm version does not match package.json."
          }

      - name: Verify and record hosted Windows runner
        shell: pwsh
        run: >
          ./tests/Test-HostedWindowsRunner.ps1
          -RequestedLabel "${{ matrix.runner }}"
          -OutputPath "${{ runner.temp }}/runner-compatibility-${{ matrix.runner }}.json"

      - name: Upload hosted Windows compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-compatibility-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-compatibility-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore pinned build tools
        run: |
          dotnet tool restore
          dotnet tool run sbom-tool -- version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Test Sites worker
        run: pnpm run test:sites

      - name: Test promotion contracts
        run: pnpm run test:promotion

      - name: Test package integrity behavior
        shell: pwsh
        run: ./tests/Test-PackageIntegrity.ps1

      - name: Test package integrity on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-PackageIntegrity.ps1

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Test portable .NET behavior
        run: >
          dotnet test
          native/DefaultAppGuard.Tests/DefaultAppGuard.Tests.csproj
          --configuration Release
          --filter "Category!=MainAlgorithmIntegration"
          --logger "console;verbosity=normal"

      - name: Build and verify release-shaped package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packagePath = Join-Path $env:RUNNER_TEMP (
            "DefaultAppGuard-$version-win-x64")
          ./packaging/Publish-Windows.ps1 `
            -Version $version `
            -OutputDirectory $packagePath `
            -PackageManagerPath pnpm `
            -NodePath node

          Import-Module ./packaging/DefaultAppGuard.Package.psm1 -Force
          $packageCheck = Test-DagPackageIntegrity -PackageRoot $packagePath
          if (-not $packageCheck.Passed) {
            throw "Hosted package integrity failed: $($packageCheck.IssueCodes -join ', ')"
          }
          $setupPath = Join-Path $packagePath "DefaultAppGuard.Setup.exe"
          if ((Get-DagPeSubsystem -Path $setupPath) -ne 2) {
            throw "Hosted Setup build does not use the Windows GUI subsystem."
          }
          $setupStdout = Join-Path $env:RUNNER_TEMP "setup-verify.stdout.txt"
          $setupStderr = Join-Path $env:RUNNER_TEMP "setup-verify.stderr.txt"
          $verification = Start-Process `
            -FilePath $setupPath `
            -ArgumentList @("--quiet", "--verify-only") `
            -WindowStyle Hidden `
            -RedirectStandardOutput $setupStdout `
            -RedirectStandardError $setupStderr `
            -Wait `
            -PassThru
          $expectedSetupExitCode = if (
            "${{ matrix.runner }}" -eq "windows-2022") {
              4
            } else {
              0
            }
          if ($verification.ExitCode -ne $expectedSetupExitCode) {
            $details = @(
              Get-Content -LiteralPath $setupStdout -Raw -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $setupStderr -Raw -ErrorAction SilentlyContinue
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            throw (
              "Hosted Setup package verification failed with exit code " +
              "$($verification.ExitCode); expected $expectedSetupExitCode." +
              "`n$($details -join "`n")")
          }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          @(
            Get-ChildItem packaging -File |
              Where-Object { $_.Extension -in @(".ps1", ".psm1") }
            Get-ChildItem tests -Filter *.ps1 -File
          ) | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)"
              }
            }
          }
          if ($failed) {
            throw "One or more PowerShell scripts failed to parse."
          }
