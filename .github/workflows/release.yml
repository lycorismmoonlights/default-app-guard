name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string
      signing_policy:
        description: Code-signing requirement for this release
        required: true
        default: unsigned-alpha
        type: choice
        options:
          - unsigned-alpha
          - require-signed

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: Main algorithm gate and release
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - default-app-guard-release
    environment: release
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        id: gate
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP (
            "DefaultAppGuard-release-{0}" -f '${{ inputs.version }}')
          $gateArguments = @{
            Version = '${{ inputs.version }}'
            OutputRoot = $releaseRoot
            PackageManagerPath = 'pnpm'
            RequireSigned = (
              '${{ inputs.signing_policy }}' -eq 'require-signed')
            SigningCertificateThumbprint = if (
              '${{ inputs.signing_policy }}' -eq 'require-signed') {
              '${{ vars.DAG_SIGNING_CERTIFICATE_THUMBPRINT }}'
            } else {
              $null
            }
            TimestampServer = if (
              '${{ inputs.signing_policy }}' -eq 'require-signed') {
              '${{ vars.DAG_TIMESTAMP_SERVER }}'
            } else {
              $null
            }
          }
          $result = ./packaging/Test-ReleaseGate.ps1 @gateArguments

          "archive=$($result.Archive)" >> $env:GITHUB_OUTPUT
          "checksum=$($result.ChecksumFile)" >> $env:GITHUB_OUTPUT
          "evidence=$($result.EvidenceFile)" >> $env:GITHUB_OUTPUT
          "evidence_directory=$($result.EvidenceDirectory)" >> $env:GITHUB_OUTPUT
          "lifecycle_evidence=$($result.LifecycleEvidenceFile)" >> $env:GITHUB_OUTPUT
          "sbom=$($result.SbomFile)" >> $env:GITHUB_OUTPUT
          "sbom_checksum=$($result.SbomChecksumFile)" >> $env:GITHUB_OUTPUT
          "signing_status=$($result.CodeSigningStatus)" >> $env:GITHUB_OUTPUT

      - name: Upload release-gate evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ inputs.version }}
          path: |
            ${{ steps.gate.outputs.archive }}
            ${{ steps.gate.outputs.checksum }}
            ${{ steps.gate.outputs.evidence }}
            ${{ steps.gate.outputs.lifecycle_evidence }}
            ${{ steps.gate.outputs.sbom }}
            ${{ steps.gate.outputs.sbom_checksum }}
            ${{ steps.gate.outputs.evidence_directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Attest release archive
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.gate.outputs.archive }}

      - name: Attest release SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.gate.outputs.archive }}
          sbom-path: ${{ steps.gate.outputs.sbom }}

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $signingStatus = '${{ steps.gate.outputs.signing_status }}'
          $trustNotice = if ($signingStatus -eq 'valid') {
            'Authenticode status: valid on the release runner. See release-gate.json for signer and timestamp evidence.'
          } else {
            'Important: this alpha is unsigned. Verify the SHA-256 file and read ENVIRONMENT-AND-RISKS.txt before installation.'
          }
          gh release create "v${{ inputs.version }}" `
            '${{ steps.gate.outputs.archive }}' `
            '${{ steps.gate.outputs.checksum }}' `
            '${{ steps.gate.outputs.evidence }}' `
            '${{ steps.gate.outputs.lifecycle_evidence }}' `
            '${{ steps.gate.outputs.sbom }}' `
            '${{ steps.gate.outputs.sbom_checksum }}' `
            --target "$env:GITHUB_SHA" `
            --title "DefaultAppGuard v${{ inputs.version }} alpha" `
            --generate-notes `
            --notes "$trustNotice" `
            --prerelease
