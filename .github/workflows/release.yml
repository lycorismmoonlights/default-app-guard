name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string
      signing_policy:
        description: Code-signing requirement for this release
        required: true
        default: require-signed
        type: choice
        options:
          - require-signed
          - unsigned-alpha

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: Main algorithm gate and release
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - default-app-guard-release
    environment: release
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.302

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate
        id: gate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNING_POLICY: ${{ inputs.signing_policy }}
          SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.DAG_SIGNING_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ vars.DAG_TIMESTAMP_SERVER }}
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP (
            "DefaultAppGuard-release-{0}" -f $env:RELEASE_VERSION)
          $gateArguments = @{
            Version = $env:RELEASE_VERSION
            OutputRoot = $releaseRoot
            PackageManagerPath = 'pnpm'
            RequireSigned = $env:SIGNING_POLICY -eq 'require-signed'
            SigningCertificateThumbprint = if (
              $env:SIGNING_POLICY -eq 'require-signed') {
              $env:SIGNING_CERTIFICATE_THUMBPRINT
            } else {
              $null
            }
            TimestampServer = if (
              $env:SIGNING_POLICY -eq 'require-signed') {
              $env:TIMESTAMP_SERVER
            } else {
              $null
            }
          }
          $result = ./packaging/Test-ReleaseGate.ps1 @gateArguments

          "archive=$($result.Archive)" >> $env:GITHUB_OUTPUT
          "checksum=$($result.ChecksumFile)" >> $env:GITHUB_OUTPUT
          "evidence=$($result.EvidenceFile)" >> $env:GITHUB_OUTPUT
          "evidence_directory=$($result.EvidenceDirectory)" >> $env:GITHUB_OUTPUT
          "lifecycle_evidence=$($result.LifecycleEvidenceFile)" >> $env:GITHUB_OUTPUT
          "watchdog_backoff_evidence=$($result.WatchdogBackoffEvidenceFile)" >> $env:GITHUB_OUTPUT
          "sbom=$($result.SbomFile)" >> $env:GITHUB_OUTPUT
          "sbom_checksum=$($result.SbomChecksumFile)" >> $env:GITHUB_OUTPUT
          "signing_status=$($result.CodeSigningStatus)" >> $env:GITHUB_OUTPUT

      - name: Upload release-gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-${{ inputs.version }}
          path: |
            ${{ steps.gate.outputs.archive }}
            ${{ steps.gate.outputs.checksum }}
            ${{ steps.gate.outputs.evidence }}
            ${{ steps.gate.outputs.lifecycle_evidence }}
            ${{ steps.gate.outputs.watchdog_backoff_evidence }}
            ${{ steps.gate.outputs.sbom }}
            ${{ steps.gate.outputs.sbom_checksum }}
            ${{ steps.gate.outputs.evidence_directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Attest release archive
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.gate.outputs.archive }}

      - name: Attest release SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.gate.outputs.archive }}
          sbom-path: ${{ steps.gate.outputs.sbom }}

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNING_STATUS: ${{ steps.gate.outputs.signing_status }}
          ARCHIVE_PATH: ${{ steps.gate.outputs.archive }}
          CHECKSUM_PATH: ${{ steps.gate.outputs.checksum }}
          EVIDENCE_PATH: ${{ steps.gate.outputs.evidence }}
          LIFECYCLE_EVIDENCE_PATH: ${{ steps.gate.outputs.lifecycle_evidence }}
          WATCHDOG_BACKOFF_EVIDENCE_PATH: ${{ steps.gate.outputs.watchdog_backoff_evidence }}
          SBOM_PATH: ${{ steps.gate.outputs.sbom }}
          SBOM_CHECKSUM_PATH: ${{ steps.gate.outputs.sbom_checksum }}
        run: |
          $signingStatus = $env:SIGNING_STATUS
          $trustNotice = if ($signingStatus -eq 'valid') {
            'Authenticode status: valid on the release runner. See release-gate.json for signer and timestamp evidence.'
          } else {
            'Important: this alpha is unsigned. Verify the SHA-256 file and read ENVIRONMENT-AND-RISKS.txt before installation.'
          }
          gh release create "v$env:RELEASE_VERSION" `
            $env:ARCHIVE_PATH `
            $env:CHECKSUM_PATH `
            $env:EVIDENCE_PATH `
            $env:LIFECYCLE_EVIDENCE_PATH `
            $env:WATCHDOG_BACKOFF_EVIDENCE_PATH `
            $env:SBOM_PATH `
            $env:SBOM_CHECKSUM_PATH `
            --target "$env:GITHUB_SHA" `
            --title "DefaultAppGuard v$env:RELEASE_VERSION alpha" `
            --generate-notes `
            --notes "$trustNotice" `
            --prerelease
