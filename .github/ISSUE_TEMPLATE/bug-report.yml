name: Bug report
description: Report a reproducible DefaultAppGuard problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, or unrelated registry exports.

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.2
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and edition
      placeholder: Windows 11 25H2 Home x64
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest sequence that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Remove personal paths and unrelated data before posting.
      render: text
